[package]
name = "oidc-verifier"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Serhij S. <div@altertech.com>"]
repository = "https://github.com/eva-ics/oidc-verifier"
description = "Async OIDC token verifier"
readme = "README.md"
keywords = ["oidc", "jwt", "verifier", "async"]

[dependencies]
aws-lc-rs = { version = "1.16.2" }
base64-url = "3.0.2"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
parking_lot = "0.12.5"
reqwest = { version = "0.12.25", features = ["native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["fs", "rt"] }
tracing = "0.1.43"

[features]
fips = ["aws-lc-rs/fips"]
